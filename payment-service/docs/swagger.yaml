basePath: /
definitions:
  main.Payment:
    type: object
host: localhost:8003
info:
  contact: {}
  description: Service for simulating payment processing.
  title: Payment Service API
  version: "1.0"
paths:
  /payments:
    post:
      consumes:
      - application/json
      description: Simulates a payment process for a booking.
      parameters:
      - description: Payment Info
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/main.Payment'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/main.Payment'
      summary: Process a payment
      tags:
      - payments
swagger: "2.0"
